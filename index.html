<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>COLDRAW クリエイター獲得・導入見積シミュレーター</title>
    <style>
        :root {
            --primary: #2563eb;
            --bg-gray: #f8fafc;
            --border: #e2e8f0;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            margin: 20px;
            background-color: #f1f5f9;
            color: #334155;
        }
        .container {
            max-width: 1100px;
            margin: 0 auto;
            background: #fff;
            padding: 24px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }
        h1 {
            font-size: 20px;
            color: #0f172a;
            border-bottom: 2px solid var(--primary);
            padding-bottom: 8px;
            margin-top: 0;
            margin-bottom: 14px;
        }
        .meta-info-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px 20px;
            background: var(--bg-gray);
            padding: 12px 16px;
            border-radius: 8px;
            margin-bottom: 12px;
            border: 1px solid var(--border);
        }
        .meta-item {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .meta-item label {
            font-weight: bold;
            font-size: 13px;
            color: #475569;
            width: 90px;
            flex-shrink: 0;
        }
        .meta-item input[type="text"], .meta-item input[type="date"] {
            flex-grow: 1;
            padding: 5px 8px;
            border: 1px solid var(--border);
            border-radius: 4px;
            font-size: 13px;
            background-color: #fff;
        }

        .config-bar {
            display: flex;
            gap: 24px;
            background: #eff6ff;
            padding: 10px 16px;
            border-radius: 8px;
            margin-bottom: 16px;
            align-items: center;
            border: 1px solid #bfdbfe;
        }
        .config-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: bold;
            font-size: 13px;
        }
        input[type="number"], select {
            padding: 5px 8px;
            border: 1px solid var(--border);
            border-radius: 4px;
            font-size: 13px;
            background-color: #fff;
        }
        input[type="number"] {
            width: 70px;
            text-align: right;
        }
        select {
            cursor: pointer;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 11.5px;
            margin-bottom: 16px;
        }
        th, td {
            border: 1px solid var(--border);
            padding: 6px 8px;
            text-align: left;
            vertical-align: middle;
        }
        th {
            background-color: var(--bg-gray);
            color: #475569;
            font-weight: 600;
        }
        .badge-mandatory {
            background: #fee2e2;
            color: #991b1b;
            padding: 2px 6px;
            border-radius: 4px;
            font-weight: bold;
            font-size: 10.5px;
        }
        .badge-optional {
            background: #e0f2fe;
            color: #0369a1;
            padding: 2px 6px;
            border-radius: 4px;
            font-weight: bold;
            font-size: 10.5px;
        }
        .text-right { text-align: right; }
        .text-center { text-align: center; }
        .row-inactive { opacity: 0.4; background-color: #fafafa; }
        
        .summary-card {
            background: #0f172a;
            color: white;
            padding: 14px 20px;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .summary-total {
            font-size: 24px;
            font-weight: bold;
            color: #38bdf8;
        }
        .btn-print {
            background: var(--primary);
            color: white;
            border: none;
            padding: 8px 18px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-size: 13px;
        }
        .btn-print:hover { background: #1d4ed8; }

        /* A4横1枚に収めるための印刷専用CSS */
        @page {
            size: A4 landscape;
            margin: 5mm 6mm;
        }
        @media print {
            body { background: white; margin: 0; padding: 0; font-size: 9.5px; color: #000; }
            .container { box-shadow: none; padding: 0; width: 100%; max-width: 100%; }
            .no-print, .checkbox-cell { display: none !important; }
            .row-inactive { display: none !important; }
            h1 { font-size: 15px; margin-bottom: 4px; padding-bottom: 3px; border-bottom-width: 1.5px; }
            
            .meta-info-grid {
                background: transparent;
                border: 1px solid #cbd5e1;
                grid-template-columns: repeat(4, 1fr);
                padding: 4px 8px;
                margin-bottom: 4px;
                gap: 2px 8px;
            }
            .meta-item label { font-size: 9.5px; width: auto; }
            
            .config-bar {
                background: transparent;
                border: 1px solid #cbd5e1;
                padding: 3px 8px;
                margin-bottom: 5px;
                gap: 16px;
            }
            .config-item { font-size: 9.5px; }

            input[type="number"], select, input[type="text"], input[type="date"] {
                border: none;
                background: transparent;
                appearance: none;
                -webkit-appearance: none;
                padding: 0;
                font-weight: bold;
                font-size: 9.5px;
                color: #000;
                width: auto;
            }
            
            table { font-size: 9px; margin-bottom: 6px; }
            th, td { padding: 2px 5px; line-height: 1.2; }
            
            .summary-card {
                background: #f8fafc;
                color: black;
                border: 1.5px solid #000;
                padding: 6px 12px;
            }
            .summary-total { color: #000; font-size: 18px; }
        }
    </style>
</head>
<body>

<div class="container">
    <h1>COLDRAW パートナーフロント業務条件・見積シミュレーター</h1>
    
    <div class="meta-info-grid">
        <div class="meta-item">
            <label for="requestDate">申請日:</label>
            <input type="date" id="requestDate">
        </div>
        <div class="meta-item">
            <label for="eventDate">開催予定日:</label>
            <input type="date" id="eventDate">
        </div>
        <div class="meta-item">
            <label for="sessionName">セッション名:</label>
            <input type="text" id="sessionName" placeholder="例：クリエイターセッション＠場所">
        </div>
        <div class="meta-item">
            <label for="mainOwner">主担当名:</label>
            <input type="text" id="mainOwner" placeholder="例：大月 信彦">
        </div>
    </div>

    <div class="config-bar">
        <div class="config-item">
            <label for="targetUnits">成約目標台数(クリエイター数):</label>
            <input type="number" id="targetUnits" value="1" min="1" onchange="calculate()"> 台
        </div>
        <div class="config-item">
            <label for="guestCount">招待客数:</label>
            <input type="number" id="guestCount" value="1" min="1" onchange="calculate()"> 名
        </div>
        <div style="font-size: 11px; color: #1e40af; margin-left: auto;" class="no-print">
            ※ Mandatory項目は自動固定され、Optional項目はチェックやプルダウンで条件変更できます。
        </div>
    </div>

    <table>
        <thead>
            <tr>
                <th class="no-print text-center" style="width: 35px;">選択</th>
                <th style="width: 140px;">フェーズ</th>
                <th style="width: 110px;">Role</th>
                <th>業務内容 / 成果定義</th>
                <th style="width: 75px;" class="text-center">区分</th>
                <th style="width: 130px;" class="text-right">費用/インセンティブ</th>
                <th style="width: 95px;" class="text-right">小計(万円)</th>
            </tr>
        </thead>
        <tbody id="tableBody">
            <!-- JavaScriptで動的生成 -->
        </tbody>
    </table>

    <div class="summary-card">
        <div>
            <div style="font-size: 12px; opacity: 0.8;">1台あたり平均単価: <span id="perUnitPrice">0</span> 万円</div>
            <div style="font-size: 15px; font-weight: bold; margin-top: 2px;">お見積り概算合計（税別）</div>
        </div>
        <div style="text-align: right;">
            <div class="summary-total" id="grandTotal">0 万円</div>
            <div style="font-size: 11px; opacity: 0.8;">（税込: <span id="grandTotalTax">0</span> 万円）</div>
        </div>
    </div>

    <div style="margin-top: 14px; text-align: right;" class="no-print">
        <button class="btn-print" onclick="window.print()">見積書・提案書として印刷 / PDF保存</button>
    </div>
</div>

<script>
const itemsData = [
    { phase: "Phase 1 : 獲得・意思確認", role: "Partner Front", content: "セッション主催・条件調整・LOI取得/契約意思確認 / LOIまたは意思確認(Hubspot入力)・毎月成果報告書提出", type: "Mandatory", price: 4, isRange: false },
    { phase: "Phase 1 : 獲得・意思確認", role: "Session Support", content: "担当レシピ・衛生管理を満たした上での素材発注/事前抽出/デモ抽出 / 1イベントあたり抽出に付随する作業の実行（※固定費）", type: "Optional", price: 1.5, isRange: true, min: 1.5, max: 5.0, step: 0.5, isFixed: true },
    { phase: "Phase 1 : 獲得・意思確認", role: "Session Support", content: "事前抽出・デモ抽出（荻原さん・宮里さんがCR社移籍までの期間・&mogまたは神田オフィスのみ）", type: "Optional", price: 0, isRange: false, note: "N/A" },
    { phase: "Phase 1 : 獲得・意思確認", role: "MAVO Drink", content: "西村さんに依頼し抽出・クール便発送 / Mavoさんにて抽出液の発送（※固定費）", type: "Optional", price: 1, isRange: true, min: 1, max: 5, step: 1, isFixed: true },
    { phase: "Phase 1 : 獲得・意思確認", role: "Creator", content: "新規クリエイター候補へプレゼンし獲得CVRを引き上げる / 当日セッションにて抽出デモ（※固定費）", type: "Optional", price: 1, isRange: true, min: 1, max: 10, step: 1, isFixed: true },
    { phase: "Phase 1 : 獲得・意思確認", role: "Creator(紹介Hub)", content: "クリエイターがPFと主軸となり企画・知り合い目線でプレゼン。紹介者HUBのための紹介フィー / 当日セッションにて抽出デモ", type: "Optional", price: 5, isRange: false },
    { phase: "Phase 1 : 獲得・意思確認", role: "Foods", content: "セッション開催を店舗または外部レンタルスペース等で行う場合のペアリングフード費用 / フード提供（※招待客数に連動）", type: "Optional", price: 1, isRange: true, min: 1, max: 10, step: 1, isGuestMultiplied: true },
    { phase: "Phase 1 : 獲得・意思確認", role: "Placement Fee", content: "セッション開催を店舗または外部レンタルスペース等で行う場合の会場費 / 会場提供（※固定費）", type: "Optional", price: 1, isRange: true, min: 1, max: 30, step: 1, isFixed: true },
    { phase: "Phase 1 : 獲得・意思確認", role: "Travel Expense", content: "承認時に概算見積をsPods遠方旅費交通費規定に照らし合わせて組込む / Partner Frontおよびセッションキャストの旅費交通費（※固定費）", type: "Optional", price: 1, isRange: true, min: 1, max: 30, step: 1, isFixed: true },
    { phase: "Phase 1 : レシピ開発・ハッカソン", role: "Partner Success", content: "Key Personに対するプレゼン・イベント企画進行管理（PSイベントは営業費カウント）", type: "Optional", price: 2, isRange: false },
    { phase: "Phase 2 : 契約・導入設置", role: "Front Support", content: "営業事務(小川さん・幸谷さん) / 契約書締結(クラウドサイン等)への依頼・機器手配・現場設置", type: "Mandatory", price: 0, isRange: false, note: "N/A" },
    { phase: "Phase 2 : 契約・導入設置", role: "Partner Front", content: "初期疎通・レクチャー / 機器設置完了・初回疎通確認・導入設置サイン取得・毎月成果報告書提出", type: "Mandatory", price: 3, isRange: false },
    { phase: "Phase 3 : 稼働追跡・改善", role: "Front Support", content: "営業事務(小川さん・幸谷さん) / 抽出回数の定期トラック(Notion集計レポート)", type: "Mandatory", price: 0, isRange: false, note: "N/A" },
    { phase: "Phase 3 : 稼働追跡・改善(3か月)", role: "Partner Front", content: "抽出ログからのヒアリング・異常値探知・改善アクション策定・レシピ共有 / 設置後3ヶ月データ運用・毎月成果報告書提出", type: "Mandatory", price: 3, isRange: false },
    { phase: "Phase 4 : レシピ開発・ハッカソン", role: "Partner Success", content: "CR理解向上イベント企画・進行（R&D費用扱い）", type: "Optional", price: 2, isRange: false }
];

function setDefaultDates() {
    const today = new Date().toISOString().split('T')[0];
    document.getElementById('requestDate').value = today;
}

function renderTable() {
    const tbody = document.getElementById('tableBody');
    tbody.innerHTML = '';

    itemsData.forEach((item, index) => {
        const isMandatory = item.type === 'Mandatory';
        const tr = document.createElement('tr');
        tr.id = `row-${index}`;
        if (!isMandatory) tr.classList.add('row-inactive');

        let priceInputHtml = '';
        if (item.note === 'N/A') {
            priceInputHtml = `<span style="color:#94a3b8;">N/A (0)</span>`;
        } else if (item.isRange) {
            let optionsHtml = '';
            const step = item.step || 1;
            for (let val = item.min; val <= item.max + 0.0001; val += step) {
                const displayVal = Math.round(val * 10) / 10;
                let labelSuffix = item.isFixed ? ' (固定)' : (item.isGuestMultiplied ? ' /人' : '');
                optionsHtml += `<option value="${displayVal}" ${displayVal === item.price ? 'selected' : ''}>${displayVal} 万円${labelSuffix}</option>`;
            }
            priceInputHtml = `<select id="price-${index}" onchange="calculate()">${optionsHtml}</select>`;
        } else {
            priceInputHtml = `<input type="number" id="price-${index}" value="${item.price}" readonly style="background:#f1f5f9;"> 万円`;
        }

        tr.innerHTML = `
            <td class="no-print text-center checkbox-cell">
                <input type="checkbox" id="check-${index}" ${isMandatory ? 'checked disabled' : ''} onchange="toggleRow(${index})">
            </td>
            <td>${item.phase}</td>
            <td><strong>${item.role}</strong></td>
            <td>${item.content}</td>
            <td class="text-center">
                <span class="${isMandatory ? 'badge-mandatory' : 'badge-optional'}">${item.type}</span>
            </td>
            <td class="text-right">${priceInputHtml}</td>
            <td class="text-right"><span id="subtotal-${index}">0</span> 万円</td>
        `;
        tbody.appendChild(tr);
    });
    calculate();
}

function toggleRow(index) {
    const checkbox = document.getElementById(`check-${index}`);
    const row = document.getElementById(`row-${index}`);
    if (checkbox.checked) {
        row.classList.remove('row-inactive');
    } else {
        row.classList.add('row-inactive');
    }
    calculate();
}

function calculate() {
    const units = parseFloat(document.getElementById('targetUnits').value) || 0;
    const guests = parseFloat(document.getElementById('guestCount').value) || 0;
    let grandTotal = 0;

    itemsData.forEach((item, index) => {
        const checkbox = document.getElementById(`check-${index}`);
        const priceInput = document.getElementById(`price-${index}`);
        const subtotalSpan = document.getElementById(`subtotal-${index}`);

        if (checkbox && checkbox.checked) {
            const unitPrice = item.note === 'N/A' ? 0 : (parseFloat(priceInput.value) || 0);
            
            let rowSubtotal = 0;
            if (item.isFixed) {
                rowSubtotal = unitPrice;
            } else if (item.isGuestMultiplied) {
                rowSubtotal = unitPrice * guests;
            } else {
                rowSubtotal = unitPrice * units;
            }

            grandTotal += rowSubtotal;
            subtotalSpan.innerText = rowSubtotal.toLocaleString(undefined, {maximumFractionDigits: 2});
        } else {
            subtotalSpan.innerText = '0';
        }
    });

    const perUnitPrice = units > 0 ? (grandTotal / units) : 0;
    const grandTotalTax = Math.round(grandTotal * 1.1 * 100) / 100;

    document.getElementById('perUnitPrice').innerText = perUnitPrice.toLocaleString(undefined, {maximumFractionDigits: 2});
    document.getElementById('grandTotal').innerText = grandTotal.toLocaleString(undefined, {maximumFractionDigits: 2}) + ' 万円';
    document.getElementById('grandTotalTax').innerText = grandTotalTax.toLocaleString(undefined, {maximumFractionDigits: 2}) + ' 万円';
}

window.onload = function() {
    setDefaultDates();
    renderTable();
};
</script>

</body>
</html>
