<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>COLDRAW クリエイター獲得・導入見積シミュレーター</title>
    <style>
        :root {
            --primary: #2563eb;
            --bg-gray: #f8fafc;
            --border: #e2e8f0;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            margin: 20px;
            background-color: #f1f5f9;
            color: #334155;
        }
        .container {
            max-width: 1100px;
            margin: 0 auto;
            background: #fff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }
        h1 {
            font-size: 22px;
            color: #0f172a;
            border-bottom: 2px solid var(--primary);
            padding-bottom: 10px;
            margin-top: 0;
        }
        .meta-info-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px 20px;
            background: var(--bg-gray);
            padding: 16px 20px;
            border-radius: 8px;
            margin-bottom: 16px;
            border: 1px solid var(--border);
        }
        .meta-item {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .meta-item label {
            font-weight: bold;
            font-size: 13px;
            color: #475569;
            width: 90px;
            flex-shrink: 0;
        }
        .meta-item input[type="text"], .meta-item input[type="date"] {
            flex-grow: 1;
            padding: 6px 10px;
            border: 1px solid var(--border);
            border-radius: 4px;
            font-size: 14px;
            background-color: #fff;
        }

        .config-bar {
            display: flex;
            gap: 20px;
            background: #eff6ff;
            padding: 12px 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            align-items: center;
            border: 1px solid #bfdbfe;
        }
        .config-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: bold;
        }
        input[type="number"], select {
            padding: 6px 10px;
            border: 1px solid var(--border);
            border-radius: 4px;
            font-size: 14px;
            background-color: #fff;
        }
        input[type="number"] {
            width: 80px;
            text-align: right;
        }
        select {
            cursor: pointer;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
            margin-bottom: 20px;
        }
        th, td {
            border: 1px solid var(--border);
            padding: 10px;
            text-align: left;
            vertical-align: top;
        }
        th {
            background-color: var(--bg-gray);
            color: #475569;
            font-weight: 600;
        }
        .badge-mandatory {
            background: #fee2e2;
            color: #991b1b;
            padding: 2px 8px;
            border-radius: 4px;
            font-weight: bold;
            font-size: 11px;
        }
        .badge-optional {
            background: #e0f2fe;
            color: #0369a1;
            padding: 2px 8px;
            border-radius: 4px;
            font-weight: bold;
            font-size: 11px;
        }
        .text-right { text-align: right; }
        .text-center { text-align: center; }
        .row-inactive { opacity: 0.5; background-color: #fafafa; }
        
        .summary-card {
            background: #0f172a;
            color: white;
            padding: 20px;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 20px;
        }
        .summary-total {
            font-size: 28px;
            font-weight: bold;
            color: #38bdf8;
        }
        .btn-print {
            background: var(--primary);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-size: 14px;
        }
        .btn-print:hover { background: #1d4ed8; }

        @media print {
            body { background: white; margin: 0; }
            .container { box-shadow: none; padding: 0; width: 100%; max-width: 100%; }
            .no-print, .checkbox-cell { display: none; }
            .row-inactive { display: none; }
            .meta-info-grid {
                background: transparent;
                border: 1px solid #cbd5e1;
                grid-template-columns: repeat(2, 1fr);
                padding: 10px 15px;
            }
            input[type="number"], select, input[type="text"], input[type="date"] {
                border: none;
                background: transparent;
                appearance: none;
                -webkit-appearance: none;
                padding: 0;
                font-weight: bold;
                font-size: 13px;
                color: #000;
            }
            .summary-card { background: #f8fafc; color: black; border: 2px solid #000; }
            .summary-total { color: #000; }
        }
    </style>
</head>
<body>

<div class="container">
    <h1>COLDRAW パートナーフロント業務条件・見積シミュレーター</h1>
    
    <div class="meta-info-grid">
        <div class="meta-item">
            <label for="requestDate">申請日:</label>
            <input type="date" id="requestDate">
        </div>
        <div class="meta-item">
            <label for="eventDate">開催予定日:</label>
            <input type="date" id="eventDate">
        </div>
        <div class="meta-item">
            <label for="sessionName">セッション名:</label>
            <input type="text" id="sessionName" placeholder="例：第1回 クリエイター体験セッション">
        </div>
        <div class="meta-item">
            <label for="mainOwner">主担当名:</label>
            <input type="text" id="mainOwner" placeholder="例：大月 / 和田">
        </div>
    </div>

    <div class="config-bar no-print">
        <div class="config-item">
            <label for="targetUnits">目標設置台数(クリエイター数):</label>
            <input type="number" id="targetUnits" value="1" min="1" onchange="calculate()"> 台
        </div>
        <div style="font-size: 12px; color: #1e40af;">
            ※ Mandatory項目は自動固定され、Optional項目はチェックやプルダウンで条件変更できます。
        </div>
    </div>

    <table>
        <thead>
            <tr>
                <th class="no-print text-center" style="width: 40px;">選択</th>
                <th style="width: 140px;">フェーズ</th>
                <th style="width: 100px;">Role</th>
                <th>業務内容 / 成果定義</th>
                <th style="width: 90px;" class="text-center">区分</th>
                <th style="width: 130px;" class="text-right">単価(万円/台)</th>
                <th style="width: 110px;" class="text-right">小計(万円)</th>
            </tr>
        </thead>
        <tbody id="tableBody">
            <!-- JavaScriptで動的生成 -->
        </tbody>
    </table>

    <div class="summary-card">
        <div>
            <div style="font-size: 14px; opacity: 0.8;">1台あたり平均単価: <span id="perUnitPrice">0</span> 万円</div>
            <div style="font-size: 16px; font-weight: bold; margin-top: 4px;">お見積り概算合計（税別）</div>
        </div>
        <div style="text-align: right;">
            <div class="summary-total" id="grandTotal">0 万円</div>
            <div style="font-size: 12px; opacity: 0.8;">（税込: <span id="grandTotalTax">0</span> 万円）</div>
        </div>
    </div>

    <div style="margin-top: 20px; text-align: right;" class="no-print">
        <button class="btn-print" onclick="window.print()">見積書・提案書として印刷 / PDF保存</button>
    </div>
</div>

<script>
const itemsData = [
    { phase: "Phase 1 : 獲得・意思確認", role: "Partner Front", content: "セッション主催・条件調整・LOI取得/契約意思確認 / LOIまたは意思確認(Hubspot入力)・毎月成果報告書提出", type: "Mandatory", price: 4, isRange: false },
    { phase: "Phase 1 : 獲得・意思確認", role: "Session Support", content: "セッション開催に伴う抽出用素材手配・抽出作業・デモ抽出 / 1イベントあたり抽出に付随する作業の実行", type: "Optional", price: 1.5, isSelectOptions: true, options: [1.5, 3] },
    { phase: "Phase 1 : 獲得・意思確認", role: "Session Support", content: "事前抽出・デモ抽出（荻原さん・宮里さんがCR社移籍までの期間・&mogまたは神田オフィスのみ）", type: "Optional", price: 0, isRange: false, note: "N/A" },
    { phase: "Phase 1 : 獲得・意思確認", role: "MAVO Drink", content: "Mavo抽出依頼発送 / Mavoさんにて抽出液の発送", type: "Optional", price: 1, isRange: false },
    { phase: "Phase 1 : 獲得・意思確認", role: "Creator", content: "新規クリエイター向けプレゼン・当日デモ協力 / 当日セッションにて抽出デモ", type: "Optional", price: 1, isRange: true, min: 1, max: 10 },
    { phase: "Phase 1 : 獲得・意思確認", role: "Placement Fee", content: "店舗/外部レンタルスペース等の会場提供費 / 会場提供", type: "Optional", price: 1, isRange: true, min: 1, max: 10 },
    { phase: "Phase 1 : レシピ開発・ハッカソン", role: "Partner Success", content: "Key Person向けイベント企画・進行開催管理", type: "Optional", price: 2, isRange: false },
    { phase: "Phase 2 : 契約・導入設置", role: "Front Support", content: "営業事務・契約書締結（クラウドサイン等）への依頼・機器手配・現場設置", type: "Mandatory", price: 0, isRange: false, note: "N/A" },
    { phase: "Phase 2 : 契約・導入設置", role: "Partner Front", content: "初期疎通・レクチャー / 機器設置完了・初回疎通確認・導入設置サイン取得・毎月成果報告書提出", type: "Mandatory", price: 3, isRange: false },
    { phase: "Phase 3 : 稼働追跡・改善", role: "Front Support", content: "抽出回数の定期トラック（Notion集計レポート）", type: "Mandatory", price: 0, isRange: false, note: "N/A" },
    { phase: "Phase 3 : 稼働追跡・改善(3か月)", role: "Partner Front", content: "異常値探知・ボトルネック特定・改善アクション策定・月次レポート・レシピ共有 / 設置後3ヶ月データ運用・毎月成果報告書提出", type: "Mandatory", price: 3, isRange: false },
    { phase: "Phase 4 : レシピ開発・ハッカソン", role: "Partner Success", content: "CR理解向上イベント企画・進行（R&D費用扱い）", type: "Optional", price: 2, isRange: false }
];

function setDefaultDates() {
    const today = new Date().toISOString().split('T')[0];
    document.getElementById('requestDate').value = today;
}

function renderTable() {
    const tbody = document.getElementById('tableBody');
    tbody.innerHTML = '';

    itemsData.forEach((item, index) => {
        const isMandatory = item.type === 'Mandatory';
        const tr = document.createElement('tr');
        tr.id = `row-${index}`;
        if (!isMandatory) tr.classList.add('row-inactive');

        let priceInputHtml = '';
        if (item.note === 'N/A') {
            priceInputHtml = `<span style="color:#94a3b8;">N/A (0)</span>`;
        } else if (item.isSelectOptions) {
            let optionsHtml = '';
            item.options.forEach(val => {
                optionsHtml += `<option value="${val}" ${val === item.price ? 'selected' : ''}>${val} 万円</option>`;
            });
            priceInputHtml = `<select id="price-${index}" onchange="calculate()">${optionsHtml}</select>`;
        } else if (item.isRange) {
            let optionsHtml = '';
            for (let val = item.min; val <= item.max; val++) {
                optionsHtml += `<option value="${val}" ${val === item.price ? 'selected' : ''}>${val} 万円</option>`;
            }
            priceInputHtml = `<select id="price-${index}" onchange="calculate()">${optionsHtml}</select>`;
        } else {
            priceInputHtml = `<input type="number" id="price-${index}" value="${item.price}" readonly style="background:#f1f5f9;"> 万円`;
        }

        tr.innerHTML = `
            <td class="no-print text-center checkbox-cell">
                <input type="checkbox" id="check-${index}" ${isMandatory ? 'checked disabled' : ''} onchange="toggleRow(${index})">
            </td>
            <td>${item.phase}</td>
            <td><strong>${item.role}</strong></td>
            <td>${item.content}</td>
            <td class="text-center">
                <span class="${isMandatory ? 'badge-mandatory' : 'badge-optional'}">${item.type}</span>
            </td>
            <td class="text-right">${priceInputHtml}</td>
            <td class="text-right"><span id="subtotal-${index}">0</span> 万円</td>
        `;
        tbody.appendChild(tr);
    });
    calculate();
}

function toggleRow(index) {
    const checkbox = document.getElementById(`check-${index}`);
    const row = document.getElementById(`row-${index}`);
    if (checkbox.checked) {
        row.classList.remove('row-inactive');
    } else {
        row.classList.add('row-inactive');
    }
    calculate();
}

function calculate() {
    const units = parseFloat(document.getElementById('targetUnits').value) || 1;
    let singleUnitTotal = 0;

    itemsData.forEach((item, index) => {
        const checkbox = document.getElementById(`check-${index}`);
        const priceInput = document.getElementById(`price-${index}`);
        const subtotalSpan = document.getElementById(`subtotal-${index}`);

        if (checkbox && checkbox.checked) {
            const unitPrice = item.note === 'N/A' ? 0 : (parseFloat(priceInput.value) || 0);
            const rowSubtotal = unitPrice * units;
            singleUnitTotal += unitPrice;
            subtotalSpan.innerText = rowSubtotal.toLocaleString(undefined, {maximumFractionDigits: 2});
        } else {
            subtotalSpan.innerText = '0';
        }
    });

    const grandTotal = singleUnitTotal * units;
    const grandTotalTax = Math.round(grandTotal * 1.1 * 100) / 100;

    document.getElementById('perUnitPrice').innerText = singleUnitTotal.toLocaleString(undefined, {maximumFractionDigits: 2});
    document.getElementById('grandTotal').innerText = grandTotal.toLocaleString(undefined, {maximumFractionDigits: 2}) + ' 万円';
    document.getElementById('grandTotalTax').innerText = grandTotalTax.toLocaleString(undefined, {maximumFractionDigits: 2}) + ' 万円';
}

window.onload = function() {
    setDefaultDates();
    renderTable();
};
</script>

</body>
</html>
